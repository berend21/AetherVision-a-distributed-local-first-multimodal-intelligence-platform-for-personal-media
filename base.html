<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="csrf-token" content="{{ csrf_token() }}">

    <title>{% block title %}Photos{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='videos.css') }}">

    {% block extra_css %}{% endblock %}

    {% block head_scripts %}{% endblock %}
</head>

<body>
    <header class="photos-header">
        <div class="header-main">

            <a href="/" class="logo home-logo" aria-label="Photos home">
                <svg class="logo-icon"
                    viewBox="0 0 24 24"
                    width="25" height="25"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true">
                    <circle cx="12" cy="12" r="9"/>
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 3v6M21 12h-6M12 21v-6M3 12h6"/>
                </svg>

                <span>Photos</span>
            </a>

            <div class="search-container">

                <span class="search-icon" aria-hidden="true">⌕</span>

                <input type="text"
                       class="search"
                       id="search"
                       placeholder="Search photos..."
                       autocomplete="off">

                <button class="search-clear"
                        id="searchClear"
                        type="button"
                        aria-label="Clear search">
                    ✕
                </button>

                <span class="search-shortcut">/</span>
            </div>

            <div class="header-actions">

                <button class="toolbar-icon-btn active"
                        id="toolbarGridView"
                        type="button"
                        title="Square grid view"
                        aria-label="Square grid view"
                        aria-pressed="true">

                    <svg viewBox="0 0 24 24"
                         width="20" height="20"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.7">

                        <rect x="4" y="4" width="6" height="6" rx="1"/>
                        <rect x="14" y="4" width="6" height="6" rx="1"/>
                        <rect x="4" y="14" width="6" height="6" rx="1"/>
                        <rect x="14" y="14" width="6" height="6" rx="1"/>
                    </svg>
                </button>

                <button class="toolbar-icon-btn"
                        id="toolbarTimelineView"
                        type="button"
                        title="Original aspect ratio"
                        aria-label="Original aspect ratio"
                        aria-pressed="false">

                    <svg viewBox="0 0 24 24"
                         width="20" height="20"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.7">

                        <rect x="3" y="6" width="18" height="12" rx="2"/>
                        <circle cx="8" cy="10" r="1.3"/>
                        <path d="m5 15 4-3 3 2 3-4 4 5"/>
                    </svg>
                </button>

                <button class="toolbar-icon-btn"
                        id="selectMode"
                        type="button"
                        title="Select photos"
                        aria-label="Select photos"
                        aria-pressed="false">

                    <svg viewBox="0 0 24 24"
                         width="20" height="20"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.7">

                        <rect x="4" y="4" width="16" height="16" rx="3"/>
                        <path d="m8 12 2.5 2.5L16 9"/>
                    </svg>
                </button>

                <button class="icon-btn"
                        id="rescan"
                        type="button"
                        title="Scan for new photos"
                        aria-label="Scan for new photos">

                    <svg viewBox="0 0 24 24"
                         width="21" height="21"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.7"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <path d="M20 7v5h-5"/>
                        <path d="M4 17v-5h5"/>
                        <path d="M5.6 9a7 7 0 0 1 11.7-2L20 12"/>
                        <path d="M4 12l2.7 5a7 7 0 0 0 11.7-2"/>
                    </svg>
                </button>

                <button class="icon-btn"
                        id="headerSettings"
                        type="button"
                        title="Options"
                        aria-label="Options">

                    <svg viewBox="0 0 24 24"
                         width="21" height="21"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.7"
                         stroke-linecap="round">

                        <path d="M4 7h16M4 17h16"/>
                        <circle cx="9" cy="7" r="2"
                                fill="#0a0a0a"/>
                        <circle cx="15" cy="17" r="2"
                                fill="#0a0a0a"/>
                    </svg>
                </button>
            </div>

            <div class="header-summary">
                <div class="header-stats" id="headerStats">

                    <strong id="headerPhotoCount">0 photos</strong>

                    <span id="headerAiCount">
                        ✦ 0 AI classified
                    </span>

                    <div class="ai-progress">
                        <span id="aiProgressBar"></span>
                    </div>

                </div>
            </div>

        </div>
    </header>
    
    <aside class="app-sidebar" id="appSidebar" aria-label="Main navigation">
        <nav class="sidebar-nav">

            <div class="sidebar-group">
                <div class="sidebar-group-title">LIBRARY</div>

                <button class="sidebar-item {% if active_section is not defined or active_section == 'photos' %}active{% endif %}"
                        type="button"
                        data-section="photos"
                        {% if active_section is not defined or active_section == 'photos' %}aria-current="page"{% endif %}>
                    <span class="sidebar-icon">
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="5" width="18" height="14" rx="3"/>
                            <circle cx="12" cy="12" r="3"/>
                            <path d="m7 5 1.5-2h7L17 5"/>
                        </svg>
                    </span>
                    <span class="sidebar-label">Photos</span>
                </button>

                <button class="sidebar-item {% if active_section == 'favourites' %}active{% endif %}"
                        type="button" data-section="favourites">
                    <span class="sidebar-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/>
                        </svg>
                    </span>
                    <span class="sidebar-label">Favourites</span>
                </button>

                <button class="sidebar-item {% if active_section == 'albums' %}active{% endif %}"
                        type="button" data-section="albums">
                    <span class="sidebar-icon">
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="5" width="18" height="15" rx="2"/>
                            <path d="M3 9h18"/>
                            <path d="M7 5V3h10v2"/>
                            <rect x="7" y="12" width="4" height="4" rx="1"/>
                            <rect x="13" y="12" width="4" height="4" rx="1"/>
                        </svg>
                    </span>
                    <span class="sidebar-label">Albums</span>
                </button>

                <button class="sidebar-item {% if active_section == 'videos' %}active{% endif %}"
                        type="button"
                        data-section="videos"
                        {% if active_section == 'videos' %}aria-current="page"{% endif %}>
                    <span class="sidebar-icon">
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="5" width="18" height="14" rx="3"/>
                            <path d="m10 9 5 3-5 3z"/>
                        </svg>
                    </span>
                    <span class="sidebar-label">Videos</span>
                </button>
            </div>

            <div class="sidebar-group">
                <div class="sidebar-group-title">EXPLORE</div>

                <button class="sidebar-item {% if active_section == 'places' %}active{% endif %}"
                        type="button" data-section="places">
                    <span class="sidebar-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/>
                            <circle cx="12" cy="10" r="2.5"/>
                        </svg>
                    </span>
                    <span class="sidebar-label">Places</span>
                </button>

                <button class="sidebar-item {% if active_section == 'people' %}active{% endif %}"
                        type="button" data-section="people">
                    <span class="sidebar-icon">
                        <svg viewBox="0 0 24 24">
                            <circle cx="9" cy="8" r="3"/>
                            <path d="M3 20v-2a6 6 0 0 1 12 0v2"/>
                            <path d="M16 5a3 3 0 0 1 0 6"/>
                            <path d="M18 14a5 5 0 0 1 3 4v2"/>
                        </svg>
                    </span>
                    <span class="sidebar-label">People</span>
                </button>
            </div>

            <div class="sidebar-group sidebar-bottom">
                <button class="sidebar-item {% if active_section == 'bin' %}active{% endif %}"
                        type="button" data-section="bin">
                    <span class="sidebar-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M3 6h18"/>
                            <path d="M8 6V4h8v2"/>
                            <path d="m5 6 1 14h12l1-14"/>
                            <path d="M10 10v6M14 10v6"/>
                        </svg>
                    </span>
                    <span class="sidebar-label">Bin</span>
                </button>
            </div>

        </nav>
    </aside>

    <main>
        {% block content %}{% endblock %}
    </main>

    <div class="toast-container" id="toastContainer"></div>
    <button class="scroll-top" id="scrollTop">↑</button>
    <script src="{{ url_for('static', filename='js/base.js') }}"></script>
    <script src="{{ url_for('static', filename='js/places.js') }}"></script>
  

    {% block scripts %}{% endblock %}

</body>
</html>
